<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Superiority — Trainer &amp; ADC</title>
  <link rel="icon" href="../assets/favicon_io/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      flex-direction: column;
      background-color: #0a1420;
      color: #ccc;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: linear-gradient(180deg, #0e1c2a 0%, #0a1420 100%);
      border-bottom: 1px solid #1e3a52;
      flex: 0 0 auto;
    }

    .back {
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #4a7a9a;
      text-decoration: none;
      padding: 0.45rem 0.8rem;
      border: 1px solid #1e3a52;
      border-radius: 6px;
      transition: color 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }
    .back:hover { color: #6ab0d8; border-color: #3d6a86; }

    .title {
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d94a3a;
      margin-right: auto;
      padding-left: 0.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tabs { display: flex; gap: 0.4rem; }

    .tab {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #8fa8ba;
      background: transparent;
      border: 1px solid #1e3a52;
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      white-space: nowrap;
    }
    .tab:hover { color: #cfe4f2; border-color: #3d6a86; }
    .tab[aria-selected="true"] {
      color: #f0d0cc;
      border-color: #d94a3a;
      background: rgba(217,74,58,0.12);
    }

    .panes { position: relative; flex: 1 1 auto; min-height: 0; }

    .panes iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    /* 두 iframe 모두 항상 실제 크기를 유지해야 한다. display:none이나 화면 밖 이동으로 숨기면
       내부 앱의 100vh 레이아웃이 0 또는 잘못된 값으로 굳어 빈 화면이 된다.
       크기·위치는 그대로 두고 겹쳐 쌓은 뒤 투명도로만 전환한다. */
    .panes iframe[hidden] {
      display: block;
      opacity: 0;
      z-index: 0;
      pointer-events: none;
    }
    .panes iframe:not([hidden]) { z-index: 1; }

    /* 분할 모드: 겹치기를 풀고 좌우로 나눈다. 같은 이유로 여기서도 iframe을 숨기지 않는다.
       비율은 --split(왼쪽 폭 %) 하나로 관리하고 핸들 드래그로 바꾼다. */
    .panes.split { --split: 50%; }
    .panes.split iframe { opacity: 1; z-index: 1; pointer-events: auto; }
    .panes.split #pane-adc     { inset: 0 auto 0 0; width: var(--split); }
    /* iframe은 대체 요소라 width:auto가 좌우 inset이 아니라 기본 300px로 풀린다. 폭을 직접 계산한다. */
    .panes.split #pane-trainer { inset: 0 0 0 var(--split); width: calc(100% - var(--split)); }

    /* 드래그 핸들. 분할일 때만 나타난다. */
    .handle { display: none; }
    .panes.split .handle {
      display: block;
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--split);
      width: 9px;
      margin-left: -4px;
      z-index: 2;
      cursor: col-resize;
      background: #1e3a52;
      background-clip: content-box;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
    }
    .panes.split .handle:hover, .panes.split.dragging .handle { background-color: #d94a3a; }
    /* 드래그 중에는 iframe이 포인터를 삼키지 않도록 막는다. */
    .panes.dragging iframe { pointer-events: none; }

    @media (max-width: 760px) {
      .title { display: none; }
      .tabs { margin-left: auto; }
      .tab { padding: 0.45rem 0.6rem; font-size: 0.72rem; }
      /* 좁은 화면에서 좌우 분할은 쓸모가 없다. */
      .tab[data-tab="split"] { display: none; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="../index.html">← Back</a>
    <div class="title">Air Superiority</div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="trainer" aria-selected="true">트레이너</button>
      <button class="tab" role="tab" data-tab="adc" aria-selected="false">ADC</button>
      <button class="tab" role="tab" data-tab="split" aria-selected="false">나란히</button>
    </div>
  </div>

  <div class="panes" id="panes">
    <iframe id="pane-trainer" src="trainer/index.html" title="이동 훈련"></iframe>
    <iframe id="pane-adc" src="adc.html" title="Aircraft ADC" hidden></iframe>
    <div class="handle" id="handle" role="separator" aria-orientation="vertical" title="드래그해서 크기 조절"></div>
  </div>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const panes = document.getElementById('panes');
    const trainer = document.getElementById('pane-trainer');
    const adc = document.getElementById('pane-adc');

    function select(name) {
      if (name !== 'trainer' && name !== 'adc' && name !== 'split') name = 'trainer';

      // 좁은 화면에서는 분할 탭이 숨겨져 있으므로 트레이너로 되돌린다.
      if (name === 'split' && window.matchMedia('(max-width: 760px)').matches) name = 'trainer';

      tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
      panes.classList.toggle('split', name === 'split');

      // 분할일 때는 둘 다 보여야 하므로 hidden을 모두 푼다.
      trainer.hidden = name === 'adc';
      adc.hidden = name === 'trainer';
    }

    tabs.forEach(t => t.addEventListener('click', () => {
      location.hash = t.dataset.tab;      // hashchange가 select 호출
    }));

    // 새로고침/뒤로가기에도 탭 유지
    addEventListener('hashchange', () => select(location.hash.slice(1)));
    select(location.hash.slice(1));

    // 분할 비율 드래그. 비율은 로컬에 남겨 다음 방문에도 유지한다.
    const handle = document.getElementById('handle');
    const saved = parseFloat(localStorage.getItem('airpower-split'));
    if (saved >= 15 && saved <= 85) panes.style.setProperty('--split', saved + '%');

    handle.addEventListener('pointerdown', e => {
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      panes.classList.add('dragging');
    });

    handle.addEventListener('pointermove', e => {
      if (!panes.classList.contains('dragging')) return;
      const box = panes.getBoundingClientRect();
      const pct = Math.min(85, Math.max(15, (e.clientX - box.left) / box.width * 100));
      panes.style.setProperty('--split', pct.toFixed(2) + '%');
    });

    handle.addEventListener('pointerup', e => {
      panes.classList.remove('dragging');
      handle.releasePointerCapture(e.pointerId);
      localStorage.setItem('airpower-split', parseFloat(panes.style.getPropertyValue('--split')));
    });

    // 더블클릭으로 50:50 복귀
    handle.addEventListener('dblclick', () => {
      panes.style.setProperty('--split', '50%');
      localStorage.setItem('airpower-split', 50);
    });
  </script>

</body>
</html>
