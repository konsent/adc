<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Superiority — Trainer &amp; ADC</title>
  <link rel="icon" href="../assets/favicon_io/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      flex-direction: column;
      background-color: #0a1420;
      color: #ccc;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: linear-gradient(180deg, #0e1c2a 0%, #0a1420 100%);
      border-bottom: 1px solid #1e3a52;
      flex: 0 0 auto;
    }

    .back {
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #4a7a9a;
      text-decoration: none;
      padding: 0.45rem 0.8rem;
      border: 1px solid #1e3a52;
      border-radius: 6px;
      transition: color 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }
    .back:hover { color: #6ab0d8; border-color: #3d6a86; }

    .title {
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d94a3a;
      margin-right: auto;
      padding-left: 0.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tabs { display: flex; gap: 0.4rem; }

    .tab {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #8fa8ba;
      background: transparent;
      border: 1px solid #1e3a52;
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      white-space: nowrap;
    }
    .tab:hover { color: #cfe4f2; border-color: #3d6a86; }
    .tab[aria-selected="true"] {
      color: #f0d0cc;
      border-color: #d94a3a;
      background: rgba(217,74,58,0.12);
    }

    .panes { position: relative; flex: 1 1 auto; min-height: 0; }

    .panes iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    /* 두 iframe 모두 항상 실제 크기를 유지해야 한다. display:none이나 화면 밖 이동으로 숨기면
       내부 앱의 100vh 레이아웃이 0 또는 잘못된 값으로 굳어 빈 화면이 된다.
       크기·위치는 그대로 두고 겹쳐 쌓은 뒤 투명도로만 전환한다. */
    .panes iframe[hidden] {
      display: block;
      opacity: 0;
      z-index: 0;
      pointer-events: none;
    }
    .panes iframe:not([hidden]) { z-index: 1; }

    @media (max-width: 760px) {
      .title { display: none; }
      .tabs { margin-left: auto; }
      .tab { padding: 0.45rem 0.6rem; font-size: 0.72rem; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="../index.html">← Back</a>
    <div class="title">Air Superiority</div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="trainer" aria-selected="true">시뮬레이터</button>
      <button class="tab" role="tab" data-tab="adc" aria-selected="false">ADC</button>
      <button class="tab" role="tab" data-tab="adc-as" aria-selected="false">ADC (Air Superiority)</button>
    </div>
  </div>

  <div class="panes" id="panes">
    <iframe id="pane-trainer" src="trainer/index.html" title="시뮬레이터"></iframe>
    <iframe id="pane-adc" src="adc-data.html" title="Aircraft ADC" hidden></iframe>
    <iframe id="pane-adc-as" src="adc.html" title="Aircraft ADC (Air Superiority)" hidden></iframe>
  </div>

  <script>
    const tabs = document.querySelectorAll('.tab');
    // 탭 이름 -> 해당 iframe. 하나만 보이고 나머지는 hidden으로 접힌다.
    const PANES = {
      trainer: document.getElementById('pane-trainer'),
      adc: document.getElementById('pane-adc'),
      'adc-as': document.getElementById('pane-adc-as'),
    };

    function select(name) {
      // 예전 링크·북마크에 남은 #split은 시뮬레이터로 보낸다.
      if (!PANES[name]) name = 'trainer';

      tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
      for (const [key, pane] of Object.entries(PANES)) pane.hidden = key !== name;
    }

    tabs.forEach(t => t.addEventListener('click', () => {
      location.hash = t.dataset.tab;      // hashchange가 select 호출
    }));

    // 새로고침/뒤로가기에도 탭 유지
    addEventListener('hashchange', () => select(location.hash.slice(1)));
    select(location.hash.slice(1));

  </script>

</body>
</html>
