<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Superiority · Aircraft ADC</title>
  <link rel="icon" href="../assets/favicon_io/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #0e0e0e;
      color: #ccc;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: linear-gradient(160deg, #0a1420 0%, #0e1c2a 60%, #0a1420 100%);
      border-right: 1px solid #1e3a52;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-head {
      padding: 1.2rem 1rem 0.9rem;
      border-bottom: 1px solid #1e3a52;
      flex-shrink: 0;
    }

    .sidebar-head a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      color: #4a7a9a;
      text-decoration: none;
      text-transform: uppercase;
    }
    .sidebar-head a:hover { color: #6ab0d8; }

    .sidebar-head h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #d94a3a;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    .sidebar-head .sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.16em;
      color: #4a6a80;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    .plane-list {
      overflow-y: auto;
      flex: 1;
      padding: 0.5rem 0 2rem;
    }

    .group-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: #3d6a86;
      text-transform: uppercase;
      padding: 1rem 1rem 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .group-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #1e3a52;
    }

    .plane-list button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-left: 2px solid transparent;
      color: #8fa8ba;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.82rem;
      padding: 0.42rem 1rem;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .plane-list button:hover {
      background: rgba(80,160,220,0.07);
      color: #cfe4f2;
    }

    .plane-list button[aria-current="true"] {
      background: rgba(217,74,58,0.12);
      border-left-color: #d94a3a;
      color: #f0d0cc;
      font-weight: 600;
    }

    /* 목록 접기. 사이드바 폭만 0으로 줄이고 토글 버튼은 남긴다. */
    .collapse {
      position: absolute;
      top: 0.5rem;
      left: 0;
      z-index: 3;
      width: 22px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e1c2a;
      color: #6ab0d8;
      border: 1px solid #1e3a52;
      border-left: none;
      border-radius: 0 5px 5px 0;
      font-size: 0.7rem;
      line-height: 1;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .collapse:hover { color: #cfe4f2; border-color: #3d6a86; }

    body.collapsed .sidebar { width: 0; border-right: none; }
    /* 접힌 사이드바 안의 내용이 삐져나오지 않게 한다. */
    body.collapsed .sidebar-head, body.collapsed .plane-list { display: none; }

    /* Viewer */
    .viewer {
      flex: 1;
      min-width: 0;
      background: #fff;
      position: relative;
    }

    .viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Mobile */
    /* pointer:coarse를 함께 건다. 이 페이지는 나란히 보기에서 좁은 pane 안에 들어가는데,
       폭만 보면 데스크톱 분할도 모바일로 오인해 목록이 가로 막대로 바뀐다.
       실제 터치 기기에서만 세로 적층 레이아웃을 쓴다. */
    @media (max-width: 760px) and (pointer: coarse) {
      body { flex-direction: column; }

      .sidebar {
        width: 100%;
        height: auto;
        flex-shrink: 0;
        border-right: none;
        border-bottom: 1px solid #1e3a52;
      }

      .sidebar-head { padding: 0.7rem 0.9rem 0.6rem; }
      .sidebar-head h1 { font-size: 0.95rem; margin-top: 0.3rem; }
      .sidebar-head .sub { display: none; }

      .plane-list {
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0.5rem 0.6rem;
        gap: 0.4rem;
      }

      .group-label {
        padding: 0 0.3rem;
        align-self: center;
        flex-shrink: 0;
      }
      .group-label::after { display: none; }

      .plane-list button {
        width: auto;
        flex-shrink: 0;
        white-space: nowrap;
        border-left: none;
        border-bottom: 2px solid transparent;
        border-radius: 3px;
        padding: 0.35rem 0.7rem;
        font-size: 0.75rem;
        background: rgba(255,255,255,0.03);
      }

      .plane-list button[aria-current="true"] {
        border-left: none;
        border-bottom-color: #d94a3a;
      }

      .viewer { flex: 1; min-height: 0; }

      /* 세로로 쌓이므로 폭이 아니라 높이를 접고, 버튼도 위쪽 모서리로 옮긴다. */
      body.collapsed .sidebar { width: 100%; height: 0; border-bottom: none; }
      .collapse {
        top: 0;
        left: 0.5rem;
        width: 30px;
        height: 20px;
        border: 1px solid #1e3a52;
        border-top: none;
        border-radius: 0 0 5px 5px;
      }
    }
  </style>
</head>
<body>

  <nav class="sidebar">
    <div class="sidebar-head">
      <a href="../index.html">← Wargame Solo Helper</a>
      <h1>Air Superiority</h1>
      <div class="sub">Modern Jet Air Combat</div>
    </div>
    <div class="plane-list" id="planeList"></div>
  </nav>

  <main class="viewer">
    <button class="collapse" id="collapse" type="button" aria-expanded="true" title="목록 접기/펼치기">◀</button>
    <iframe id="adcFrame" title="Aircraft ADC"></iframe>
  </main>

  <!-- data.js defines window.ADC_PAGES; titles here are the source of truth,
       because the page-*.html filenames drift from the actual aircraft. -->
  <script src="adc/assets/data.js"></script>
  <script>
    // Sorted page-NN filenames; index N == that file's window.ADC_PAGE value.
    const FILES = [
      "page-01-f4-f-phantom-ii.html",
      "page-02-f4-e-phantom-ii.html",
      "page-03-f4-f-ice-phantom-ii.html",
      "page-04-f4-km-phantom-ii.html",
      "page-05-f4-s-phantom-ii.html",
      "page-06-f104-s-starfighter.html",
      "page-07-f14a-tomcat.html",
      "page-08-f14d-tomcat.html",
      "page-09-f15a-eagle.html",
      "page-10-f15c-eagle.html",
      "page-11-f16a-fighting-falcon.html",
      "page-12-f16c-fighting-falcon.html",
      "page-13-fa18a-hornet.html",
      "page-14-f19a-stealth-fighter.html",
      "page-15-saab-f35-draken.html",
      "page-16-saab-ja37-viggen.html",
      "page-17-tornado-f3.html",
      "page-18-mirage-iiie.html",
      "page-19-mirage-f1e.html",
      "page-20-mirage-2000.html",
      "page-21-mirage-2000c.html",
      "page-22-mig-23-flogger-g.html",
      "page-23-mig-29-fulcrum-a.html",
      "page-24-mig-31-foxhound-a.html",
      "page-25-mig-21mf-fishbed-j.html",
      "page-26-mig-21bis-fishbed-n.html",
      "page-27-su-15-flagon-f.html",
      "page-28-su-17-22-fitter-hj.html",
      "page-29-su-27-flanker-a.html"
    ];

    // data.js order is already grouped by bloc; slice it by index range.
    const GROUPS = [
      { label: "US",     start: 0,  end: 14 },
      { label: "Europe", start: 14, end: 21 },
      { label: "Soviet", start: 21, end: 29 }
    ];

    const pages = window.ADC_PAGES || [];
    const count = Math.min(pages.length, FILES.length);
    const listEl = document.getElementById("planeList");
    const frame = document.getElementById("adcFrame");
    const buttons = [];
    let shownIndex = null;

    for (const group of GROUPS) {
      const end = Math.min(group.end, count);
      if (end <= group.start) continue;

      const label = document.createElement("div");
      label.className = "group-label";
      label.textContent = group.label;
      listEl.appendChild(label);

      for (let i = group.start; i < end; i++) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = pages[i].title;
        // replaceState, not location.hash: selecting an aircraft must not add a
        // history entry, so Back leaves the viewer instead of walking the
        // previously viewed aircraft. The hash still updates for refresh/links.
        button.addEventListener("click", () => {
          history.replaceState(null, "", "#" + i);
          show();
        });
        listEl.appendChild(button);
        buttons[i] = button;
      }
    }

    function show() {
      const raw = parseInt(location.hash.slice(1), 10);
      const index = Number.isInteger(raw) && raw >= 0 && raw < count ? raw : 0;

      // location.replace, not src=: setting src pushes a history entry onto the
      // iframe, so Back would rewind through previously viewed aircraft instead
      // of leaving the viewer. replace() swaps the document without one.
      // shownIndex tracks what's loaded — reading contentWindow.location is
      // unreliable before the first load lands (about:blank).
      if (shownIndex !== index) {
        const src = "adc/" + FILES[index];
        if (shownIndex === null) frame.setAttribute("src", src);
        else frame.contentWindow.location.replace(src);
        shownIndex = index;
      }

      buttons.forEach((button, i) => {
        if (i === index) button.setAttribute("aria-current", "true");
        else button.removeAttribute("aria-current");
      });
      buttons[index]?.scrollIntoView({ block: "nearest", inline: "nearest" });
    }

    window.addEventListener("hashchange", show);
    show();

    // 목록 접기. 상태는 로컬에 남겨 다음 방문에도 유지한다.
    const collapse = document.getElementById("collapse");
    function setCollapsed(on) {
      document.body.classList.toggle("collapsed", on);
      collapse.textContent = on ? "▶" : "◀";
      collapse.setAttribute("aria-expanded", String(!on));
      localStorage.setItem("adc-list-collapsed", on ? "1" : "0");
    }
    collapse.addEventListener("click", () => {
      setCollapsed(!document.body.classList.contains("collapsed"));
    });
    setCollapsed(localStorage.getItem("adc-list-collapsed") === "1");

    // ADC 카드는 210mm 고정 폭이라 좁은 창에서 가로·세로로 넘친다.
    // 스크롤바 대신 빈 여백을 잡고 끌어서 옮길 수 있게 내부 문서에 핸들러를 심는다.
    // 같은 출처라 contentDocument에 접근할 수 있다.
    function enablePan() {
      const doc = frame.contentDocument;
      if (!doc || !doc.body || doc.body.dataset.panReady) return;
      doc.body.dataset.panReady = "1";

      const el = doc.scrollingElement || doc.documentElement;
      let sx = 0, sy = 0, left = 0, top = 0, panning = false;

      doc.addEventListener("pointerdown", e => {
        // 주 버튼만. 텍스트 선택·링크·버튼 조작은 그대로 두고 여백에서만 잡는다.
        if (e.button !== 0) return;
        if (e.target.closest("a, button, input, select, textarea")) return;
        panning = true;
        sx = e.clientX; sy = e.clientY;
        left = el.scrollLeft; top = el.scrollTop;
        doc.body.style.cursor = "grabbing";
        // 드래그 중 텍스트가 파랗게 선택되는 것을 막는다.
        doc.body.style.userSelect = "none";
        el.style.scrollBehavior = "auto";   // smooth 스크롤이 걸려 있으면 드래그가 끈적해진다
        doc.documentElement.setPointerCapture?.(e.pointerId);
      });

      doc.addEventListener("pointermove", e => {
        if (!panning) return;
        e.preventDefault();
        el.scrollLeft = left - (e.clientX - sx);
        el.scrollTop = top - (e.clientY - sy);
      });

      const end = e => {
        if (!panning) return;
        panning = false;
        doc.body.style.cursor = "grab";     // 빈 값으로 되돌리면 잡을 수 있다는 표시가 사라진다
        doc.body.style.userSelect = "";
        doc.documentElement.releasePointerCapture?.(e.pointerId);
      };
      doc.addEventListener("pointerup", end);
      doc.addEventListener("pointercancel", end);

      // 트랙패드 두 손가락 스와이프는 브라우저 기본 스크롤로 이미 동작한다.
      // 터치는 CSS만으로 충분하다: 기본 팬 제스처를 양축 모두 허용한다.
      // app.js가 로드 후 body를 다시 채우므로 인라인 style은 지워진다. 스타일시트로 심는다.
      const style = doc.createElement("style");
      style.textContent = "body{cursor:grab;touch-action:pan-x pan-y}";
      doc.head.appendChild(style);
    }

    // 기체를 바꿀 때마다 문서가 갈리므로 매 load마다 다시 심는다.
    frame.addEventListener("load", enablePan);
    enablePan();
  </script>

</body>
</html>
